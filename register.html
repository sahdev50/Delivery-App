<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <meta name="apple-mobile-web-app-title" content="Eat Dash" />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="./styles/index.css">
    <title>Create account — Eat Dash</title>
</head>
<body>

<header class="navbar">
    <div><a href="index.html"><img src="./public/logo.png" alt="website logo" width="150" height="50"></a></div>
    <ul id="navLinks">
        <li><a href="login.html">Login</a></li>
        <li><button class="signup-button" onclick="location.href='register.html'">Sign Up</button></li>
    </ul>
</header>

<main class="app-main">
  <div class="auth-wrap">
    <h2 class="eyebrow">
      <span class="material-icons-outlined" style="font-size:16px;">restaurant</span>
      Join Eat Dash
    </h2>
    <h1 class="page-title">Create your account</h1>
    <p class="page-sub">Register once, then log in any time to order from the menu.</p>

    <div class="card-panel">
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Full name</label>
          <input type="text" id="regName" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPhone">Phone number</label>
          <input type="tel" id="regPhone" class="form-input" required pattern="[0-9+ \-]{7,15}">
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-input" required minlength="6">
          <p class="form-help">At least 6 characters.</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPasswordConfirm">Confirm password</label>
          <input type="password" id="regPasswordConfirm" class="form-input" required minlength="6">
        </div>
        <div id="registerError" class="form-error" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-block">
          Create account
          <span class="material-icons-outlined" style="font-size:18px;">arrow_forward</span>
        </button>
      </form>
      <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<script src="./js/app.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('registerError');
    errorBox.style.display = 'none';

    const customerName = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regPasswordConfirm').value;

    if (password !== confirm){
      errorBox.textContent = 'Passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }

    const result = registerCustomer({ customerName, phone, email, password });
    if (!result.ok){
      errorBox.textContent = result.message;
      errorBox.style.display = 'block';
      return;
    }

    loginCustomer(email, password);
    window.location.href = 'customer.html';
  });
</script>
</body>
</html>
