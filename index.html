<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./faivicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Eat Dash" />
    <link rel="manifest" href="./favicon/site.webmanifest" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet">
    <link rel="stylesheet" href="./styles/index.css">
    <title>Eat Dash</title>
</head>
<body>
    <!-- Header/Navbar -->
     <header class="navbar">
        <div>
            <img src="./public/logo.png" alt="website logo" width="150" height="50">
        </div>
        
        <ul class="nav-icons">
            <li>
                Login
            </li>
            <li>
                <button class="signup-button">Sign Up</button>
            </li>
        </ul>
     </header>
     <div class="landing-page">
        <div class="landing-page-content">
            <div class="first-half">
            <h2 class="text-headline">
                <span class="material-icons-outlined">local_fire_department</span>
                Fast Delivery . Best Prices
            </h2>
            <h1 class="title">Delicious Food,</h1>
            <h1 class="title title-box">Delivered 
                <div class="highlighted-h1">
                    <span>Fast</span>
                    <span></span>
                </div>
            </h1>
            <div class="bottom-para-and-search">
                <p>Order from your favorite restaurants near you</p>
                <div class="search-box">
                    <span class="material-icons-outlined">location_on</span>
                    <input type="text" placeholder="Enter your location" class="search-input">
                    <button class="search-button">
                        Find Food
                        <span class="material-icons-outlined">arrow_forward</span>
                    </button>
                </div>
            </div>

            <div class="rating-box">
                <div class="profiles">
                    <img src="./public/p1.png" alt="">
                    <img src="./public/p2.png" alt="">
                    <img src="./public/p3.png" alt="">
                    <img src="./public/p4.png" alt="">
                </div>
                <div class="stars-box">
                    <p>join 10000+ happy customers</p>
                    <div class="stars">
                        <span class="material-icons-outlined">star</span>
                        <span class="material-icons-outlined">star</span>
                        <span class="material-icons-outlined">star</span>
                        <span class="material-icons-outlined">star</span>
                        <span class="material-icons-outlined">star_half</span>
                        <span>4.8</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="second-half">
            <div class="delivery-time">
                <div class="delivery-icon">
                    <span class="material-icons-outlined">moped_package</span>
                </div>
                <div class="delivery-text">
                    <h3>
                        <span class="delivery-time-value">25</span>
                        Mins
                    </h3>
                    <p>Delivery Time</p>
                </div>
            </div>
            <div class="start-box">
                <div class="star-icon">
                    <span class="material-icons-outlined">star</span>
                </div>
                <div class="star-text">
                    <h3>
                        <span class="delivery-time-value">4.8</span>
                    </h3>
                    <p>Avg. Rating</p>
                </div>
            </div>
            <img src="./public/LandPage.png" alt="Landing Page Image" />
        </div>
        </div>
     </div>
    
</body>
</html>
